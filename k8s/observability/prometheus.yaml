apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: dawatch
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: pushgateway
        # Without this, Prometheus overwrites the job label the CronJob
        # pushed with the scrape job's own name.
        honor_labels: true
        static_configs:
          - targets: ["pushgateway.dawatch.svc.cluster.local:9091"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: dawatch
data:
  dawatch.yml: |
    groups:
      - name: dawatch
        rules:
          - alert: DawatchStale
            # The failure that matters: a job that quietly stops running
            # produces no errors and no notifications, and is otherwise
            # invisible. Staleness is the only signal that catches it.
            expr: time() - dawatch_last_success_timestamp_seconds > 172800
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "dawatch has not completed a clean run in over 48 hours"

          - alert: DawatchErrors
            expr: increase(dawatch_errors_total[1h]) > 0
            for: 5m
            labels:
              severity: info
            annotations:
              summary: "dawatch reported errors in the last hour"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: dawatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
          ports:
            - name: http
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: dawatch
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
