apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dawatch

# Shared by both observability/ (self-contained demo stack) and monitoring/
# (existing cluster Prometheus Operator). Kustomize forbids referencing a
# bare file across directories, so the Pushgateway is its own component.
resources:
  - pushgateway.yaml
