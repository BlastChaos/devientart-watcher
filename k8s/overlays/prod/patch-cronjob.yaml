apiVersion: batch/v1
kind: CronJob
metadata:
  name: dawatch
  namespace: dawatch
spec:
  # Hourly suits a watch feed: artists post through the day, and the paging
  # rule makes a run with nothing new cost exactly one request.
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: dawatch
              imagePullPolicy: IfNotPresent
